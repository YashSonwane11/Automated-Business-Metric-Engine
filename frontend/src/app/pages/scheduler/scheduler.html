<div class="page-header">
  <div class="page-title-group">
    <h1 class="mat-headline-4">Scheduler</h1>
    <p class="mat-body-1 text-muted">Manage batch job executions and recurring tasks.</p>
  </div>
  <div class="header-actions">
    <button mat-stroked-button color="primary" (click)="runNow()" [disabled]="isRunning()">
      <mat-icon fontSet="material-symbols-outlined">play_arrow</mat-icon>
      {{ isRunning() ? 'Running...' : 'Run Now' }}
    </button>
    <button mat-flat-button color="primary" (click)="createSchedule()">
      <mat-icon fontSet="material-symbols-outlined">add_task</mat-icon>
      New Schedule
    </button>
  </div>
</div>

<mat-card class="table-card">
  <table mat-table [dataSource]="schedules()">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Job Name </th>
      <td mat-cell *matCellDef="let job" class="job-name-cell">
        <mat-icon fontSet="material-symbols-outlined" class="text-muted">schedule</mat-icon>
        <span>{{ job.name }}</span>
      </td>
    </ng-container>

    <!-- Cron Column -->
    <ng-container matColumnDef="cronExpression">
      <th mat-header-cell *matHeaderCellDef> Cron Schedule </th>
      <td mat-cell *matCellDef="let job" class="mono-text"> {{ job.cronExpression }} </td>
    </ng-container>

    <!-- Next Run Column -->
    <ng-container matColumnDef="nextRun">
      <th mat-header-cell *matHeaderCellDef> Next Run </th>
      <td mat-cell *matCellDef="let job" class="text-muted"> {{ job.nextRun }} </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let job">
        <mat-slide-toggle 
          [checked]="job.status === 'Active'" 
          (change)="toggleStatus(job)" 
          color="primary">
          <span [class.text-muted]="job.status === 'Paused'">{{ job.status }}</span>
        </mat-slide-toggle>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="actions-header"> Actions </th>
      <td mat-cell *matCellDef="let job" class="actions-cell">
        <button mat-icon-button color="primary" (click)="editJob(job)" aria-label="Edit">
          <mat-icon fontSet="material-symbols-outlined">edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteJob(job)" aria-label="Delete">
          <mat-icon fontSet="material-symbols-outlined">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.paused-row]="row.status === 'Paused'"></tr>
  </table>
</mat-card>
