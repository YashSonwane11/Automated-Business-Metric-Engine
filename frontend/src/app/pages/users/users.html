<div class="page-header">
  <div class="page-title-group">
    <h1 class="mat-headline-4">User Management</h1>
    <p class="mat-body-1 text-muted">Manage system users, roles, and access permissions.</p>
  </div>
  <button mat-flat-button color="primary">
    <mat-icon fontSet="material-symbols-outlined">add</mat-icon>
    Add User
  </button>
</div>

<mat-card class="table-card">
  <table mat-table [dataSource]="users()">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let user">
        <div class="user-cell">
          <div class="user-avatar">{{ user.name.charAt(0) }}</div>
          <span>{{ user.name }}</span>
        </div>
      </td>
    </ng-container>

    <!-- Email Column -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>
      <td mat-cell *matCellDef="let user" class="text-muted"> {{ user.email }} </td>
    </ng-container>

    <!-- Role Column -->
    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef> Role </th>
      <td mat-cell *matCellDef="let user"> {{ user.role }} </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let user">
        <mat-chip [color]="user.status === 'Active' ? 'primary' : 'warn'" selected>
          {{ user.status }}
        </mat-chip>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="actions-header"> Actions </th>
      <td mat-cell *matCellDef="let user" class="actions-cell">
        <button mat-icon-button color="primary" (click)="editUser(user)" aria-label="Edit">
          <mat-icon fontSet="material-symbols-outlined">edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteUser(user)" aria-label="Delete">
          <mat-icon fontSet="material-symbols-outlined">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</mat-card>
