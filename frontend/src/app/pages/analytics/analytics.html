<div class="page-header">
  <div class="page-title-group">
    <h1 class="mat-headline-4">Analytics</h1>
    <p class="mat-body-1 text-muted">Deep dive into daily, weekly, and monthly revenue trends.</p>
  </div>
</div>

<div *ngIf="loading()" class="loading-state">
  <mat-spinner diameter="48"></mat-spinner>
</div>

<div *ngIf="error()" class="error-state">
  <mat-icon color="warn">error</mat-icon>
  <p>{{ error() }}</p>
</div>

<div *ngIf="!loading() && !error()" class="analytics-container">
  <mat-card class="chart-card large-chart">
    <mat-card-header>
      <mat-card-title>Revenue Trend</mat-card-title>
    </mat-card-header>
    <mat-card-content class="chart-wrapper">
      <canvas baseChart
        [data]="revenueTrend().data"
        [options]="revenueTrend().options"
        [type]="revenueTrend().type">
      </canvas>
    </mat-card-content>
  </mat-card>

  <mat-card class="chart-card large-chart">
    <mat-card-header>
      <mat-card-title>Order Volume</mat-card-title>
    </mat-card-header>
    <mat-card-content class="chart-wrapper">
      <canvas baseChart
        [data]="ordersBar().data"
        [options]="ordersBar().options"
        [type]="ordersBar().type">
      </canvas>
    </mat-card-content>
  </mat-card>
</div>
