spring.application.name=metric-engine

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/metric_engine_db
spring.datasource.username=postgres
spring.datasource.password=Yash123

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=8080

# SQL Init — run schema.sql on startup
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Batch Config
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Multipart file upload size limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.org.springframework.batch=INFO